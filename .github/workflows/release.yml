name: Release

# Publishes the .rbz to a GitHub Release. Two ways to trigger:
#   1. Push a version tag:   git tag v1.0.0 && git push origin v1.0.0
#   2. Manual dispatch:      Actions -> Release -> Run workflow (enter a tag)
# The manual path also creates the tag, so it works even where tag pushes are
# restricted.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag/version to release (e.g. v1.0.0)'
        required: true
        default: 'v2.0.0'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'

      - name: Run tests
        run: |
          ruby tools/test_logic.rb
          ruby tools/test_builder.rb

      - name: Build .rbz
        run: ./tools/build_rbz.sh

      # Release text: this version's CHANGELOG section, the upgrade
      # instructions, and GitHub's "What's Changed" + "Full Changelog" (the
      # format of earlier releases). Re-running for an existing tag updates it.
      - name: Compose release notes
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          VER="${TAG#v}"
          NOTES="$(awk -v h="## [$VER]" 'index($0,h)==1 {f=1; next} f && /^## / {exit} f' CHANGELOG.md)"
          GENERATED="$(gh api "repos/$GITHUB_REPOSITORY/releases/generate-notes" \
                        -f tag_name="$TAG" --jq .body || true)"
          {
            echo "## Novedades — v$VER"
            if [ -n "$NOTES" ]; then echo "$NOTES"; else echo; echo "Ver CHANGELOG.md."; fi
            echo; echo '---'; echo
            cat .github/release-notes.md
            if [ -n "$GENERATED" ]; then echo; echo '---'; echo; echo "$GENERATED"; fi
          } > dist/release-body.md
          cat dist/release-body.md

      - name: Create or update GitHub Release with .rbz
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: SKP E-Plumb ${{ github.event.inputs.tag || github.ref_name }}
          files: dist/SKP-E-Plumb.rbz
          body_path: dist/release-body.md
          generate_release_notes: false
